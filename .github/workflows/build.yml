name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows amd64
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Package
        run: |
          go tool mygo build -platform windows/amd64
          test -n "$(find build -name '*-setup-*.exe' -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: devbox-windows-amd64
          if-no-files-found: error
          path: |
            build/windows-amd64/DevBox.exe
            build/windows-amd64/*-setup-*.exe

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  release:
    name: Windows amd64 release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload
